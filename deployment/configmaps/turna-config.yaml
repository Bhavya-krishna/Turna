apiVersion: v1
kind: ConfigMap
metadata:
  name: turna-config
  labels:
    app.kubernetes.io/name: turna
    app.kubernetes.io/part-of: turna-app
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "True"
  POSTGRES_DB: "turna_db"
  DATABASE_HOST: "turna-postgres"
  DATABASE_PORT: "5432"
  REDIS_URL: "redis://turna-redis:6379/0"
  CELERY_BROKER_URL: "redis://turna-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://turna-redis:6379/0"
