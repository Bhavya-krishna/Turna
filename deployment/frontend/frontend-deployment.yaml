apiVersion: apps/v1
kind: Deployment
metadata:
  name: turna-frontend
  labels:
    app.kubernetes.io/name: turna-frontend
    app.kubernetes.io/part-of: turna-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: turna-frontend
  template:
    metadata:
      labels:
        app: turna-frontend
        app.kubernetes.io/part-of: turna-app
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx-web
          image: turna-frontend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BACKEND_HOST
              value: "turna-backend:8000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: turna-frontend
  labels:
    app.kubernetes.io/name: turna-frontend
    app.kubernetes.io/part-of: turna-app
spec:
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: turna-frontend
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: turna-frontend-route
  labels:
    app.kubernetes.io/name: turna-frontend
    app.kubernetes.io/part-of: turna-app
spec:
  to:
    kind: Service
    name: turna-frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
