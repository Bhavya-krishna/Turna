apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: turna-backend-hpa
  labels:
    app.kubernetes.io/name: turna-backend
    app.kubernetes.io/part-of: turna-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: turna-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
