apiVersion: apps/v1
kind: Deployment
metadata:
  name: turna-postgres
  labels:
    app.kubernetes.io/name: turna-postgres
    app.kubernetes.io/part-of: turna-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: turna-postgres
  template:
    metadata:
      labels:
        app: turna-postgres
        app.kubernetes.io/part-of: turna-app
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: turna-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: turna-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: turna-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - turna_user
                - -d
                - turna_db
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - turna_user
                - -d
                - turna_db
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: turna-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: turna-postgres
  labels:
    app.kubernetes.io/name: turna-postgres
    app.kubernetes.io/part-of: turna-app
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: turna-postgres
