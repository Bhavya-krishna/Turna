apiVersion: apps/v1
kind: Deployment
metadata:
  name: turna-redis
  labels:
    app.kubernetes.io/name: turna-redis
    app.kubernetes.io/part-of: turna-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: turna-redis
  template:
    metadata:
      labels:
        app: turna-redis
        app.kubernetes.io/part-of: turna-app
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: turna-redis
  labels:
    app.kubernetes.io/name: turna-redis
    app.kubernetes.io/part-of: turna-app
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: turna-redis
