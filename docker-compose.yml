version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turna_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turna_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 turna.wsgi:application"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=turna-production-secret-key-change-me-in-prod-!@#$
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - DATABASE_URL=postgres://turna_user:turna_secure_pass@db:5432/turna_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turna_celery_worker
    command: celery -A turna worker -l info
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=turna-production-secret-key-change-me-in-prod-!@#$
      - DATABASE_URL=postgres://turna_user:turna_secure_pass@db:5432/turna_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turna_celery_beat
    command: celery -A turna beat -l info
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=turna-production-secret-key-change-me-in-prod-!@#$
      - DATABASE_URL=postgres://turna_user:turna_secure_pass@db:5432/turna_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: turna_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: turna_postgres
    environment:
      - POSTGRES_DB=turna_db
      - POSTGRES_USER=turna_user
      - POSTGRES_PASSWORD=turna_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turna_user -d turna_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
